name: Portfolio build
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with the existing GitHub Pages dependencies
        run: bundle exec jekyll build --trace
      - name: Check the main pages and assets
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/projects/index.html
          test -f _site/assets/css/portfolio.css
          test -f _site/assets/js/portfolio.js
          test -f _site/CV_Kailash.pdf
      - name: Package the site without renaming existing downloads
        run: tar -czf redesigned-portfolio.tar.gz -C _site .
      - uses: actions/upload-artifact@v4
        with:
          name: redesigned-portfolio
          path: redesigned-portfolio.tar.gz
